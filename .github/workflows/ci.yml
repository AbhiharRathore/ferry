name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ferry
          POSTGRES_PASSWORD: ferry
          POSTGRES_DB: ferry
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ferry" --health-interval 2s --health-timeout 3s --health-retries 20
    env:
      FERRY_TEST_DATABASE_URL: postgresql+psycopg://ferry:ferry@localhost:5432/ferry_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Migrations apply and roll back
        env:
          FERRY_DATABASE_URL: postgresql+psycopg://ferry:ferry@localhost:5432/ferry
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head
      - run: pytest -q

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t ferry .
