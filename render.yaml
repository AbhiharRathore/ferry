# Render Blueprint: free-tier demo of Ferry (Render dashboard -> New -> Blueprint).
#
# Render's free plan has web services and one free Postgres, but no background workers,
# so the demo runs the delivery worker inside the API process (FERRY_EMBEDDED_WORKER).
# The free database expires 30 days after creation; the service sleeps after 15 minutes
# idle, and so does the worker with it.
databases:
  - name: ferry-db
    plan: free
    region: singapore

services:
  - type: web
    name: ferry-api
    runtime: docker
    plan: free
    region: singapore
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: FERRY_DATABASE_URL
        fromDatabase:
          name: ferry-db
          property: connectionString
      # Generated by Render; read it in the dashboard to create an app (POST /v1/apps).
      - key: FERRY_ADMIN_TOKEN
        generateValue: true
      - key: FERRY_EMBEDDED_WORKER
        value: "true"
      - key: FERRY_ALLOW_PRIVATE_TARGETS
        value: "false"
      - key: FERRY_ALLOW_HTTP
        value: "false"
